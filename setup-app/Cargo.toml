[package]
name = "acvupscaler-setup"
version = "1.0.0-beta.1"
edition = "2021"
description = "Settings and installation tool for ACVUpscaler (Assassin's Creed Valhalla)"
license = "MIT"

[[bin]]
name = "ACVUpscalerSetup"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
